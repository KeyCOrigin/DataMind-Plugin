[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamind-gateway"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "asyncpg>=0.29", "PyJWT[crypto]>=2.8", "datamind>=0.3.2", "datamind-contracts>=1.0", "datamind-mcp-provider>=1.0"]

[project.scripts]
datamind-mcp = "datamind_gateway.stdio_server:run"

[tool.setuptools.packages.find]
where = ["src"]
