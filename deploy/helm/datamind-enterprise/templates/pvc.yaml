{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datamind-dataplane-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
{{- end }}
